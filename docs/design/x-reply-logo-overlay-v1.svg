<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BeatAPI X Reply icon</title>
  <desc id="desc">The BeatAPI logo with a separate X badge layered over its lower-right corner.</desc>
  <defs>
    <clipPath id="tile-clip">
      <rect width="1024" height="1024" rx="188" />
    </clipPath>
    <filter id="badge-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.42" />
    </filter>
  </defs>

  <g clip-path="url(#tile-clip)">
    <rect width="1024" height="1024" fill="#0b0d12" />
    <image
      x="74"
      y="48"
      width="826"
      height="826"
      preserveAspectRatio="xMidYMid meet"
      xlink:href="../../public/logo-light.png"
      href="../../public/logo-light.png"
    />

